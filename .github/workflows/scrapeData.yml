name: Run scrapeData.py

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 3" # Every Wednesday at 20:00

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      selenium:
        image: selenium/standalone-chrome
        options: --shm-size=2gb

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" # Latest stable version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install xvfb
        run: sudo apt-get install xvfb

      - name: Run scrapeData.py
        run: python scrapeData.py
        env:
          SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit and push changes
        run: |
          git config --local user.email "188308680+AuriaTechnologies@users.noreply.github.com"
          git config --local user.name "AuriaTechnologies"
          if ! git diff --quiet; then
            git add .
            CO_AUTHORS=$(jq -r 'to_entries[] | "Co-authored-by: \(.value) <\(.key)+\(.value)@users.noreply.github.com>"' profilesGitHub.json)
            git commit \
              -m "Executed scrapeData.py [GitHub Action]" \
              -m "Co-authored-by: GitHub Action <action@github.com>" \
              -m "$CO_AUTHORS"
            git push
          else
            echo "No changes to push."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
