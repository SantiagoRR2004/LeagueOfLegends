name: Run graphData.py

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Run scrapeData.py
    types:
      - completed

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" # Latest stable version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run graphData.py
        run: python graphData.py

      - name: Commit and push changes
        run: |
          git config --local user.email "188308680+AuriaTechnologies@users.noreply.github.com"
          git config --local user.name "AuriaTechnologies"
          if ! git diff --quiet; then
            git add .
            git commit \
              -m "Executed graphData.py [GitHub Action]" \
              -m "Co-authored-by: GitHub Action <action@github.com>"
            git push origin HEAD:${TARGET_BRANCH}
          else
            echo "No changes to push."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
